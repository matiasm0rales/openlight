name: Release

# Arma los instaladores de los 3 SO.
#  - Con un tag `v*` además crea (o completa) un *borrador* de Release con los instaladores:
#    publicarlo es decisión de quien mantiene el repo. Con la clave del updater cargada el
#    borrador lleva también los `.sig` y el `latest.json` (y se verifica que esté completo).
#  - Con `workflow_dispatch` solo deja los instaladores como artifacts del run.
#  - En los PR que tocan el empaquetado hace lo mismo (sin Release) para que un cambio en el
#    bundle no rompa el release recién el día del tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "app/src-tauri/tauri.conf.json"
      - "app/src-tauri/tauri.updater.conf.json"
      - "app/src-tauri/Info.plist"
      - "app/src-tauri/icons/**"
      - "tools/release/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # El borrador se crea una sola vez, antes de la matriz: si cada job lo buscara por su cuenta,
  # dos que terminan a la vez podrían crear dos. Sin tag no hace nada.
  borrador:
    name: Borrador de la Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: La versión de la app coincide con el tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        # El updater compara con la versión de tauri.conf.json: si no se subió, nadie se entera de
        # la versión nueva. Se corta acá, antes de compilar.
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::el tag es $TAG pero app/src-tauri/tauri.conf.json dice $version."
            exit 1
          fi

      - name: Crear o reusar el borrador
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Los borradores no se pueden pedir por tag: hay que buscarlos en la lista.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | "\(.id) \(.tag_name)"' \
            | awk -v tag="$TAG" '$2 == tag && !visto { print $1; visto = 1 }')
          if [ -z "$id" ]; then
            prerelease=false
            case "$TAG" in *-*) prerelease=true ;; esac
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="OpenLight $TAG" \
              -F draft=true -F prerelease="$prerelease" --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: borrador
    strategy:
      fail-fast: false
      # Con tag, de a uno: cada job lee el latest.json del borrador, le suma sus plataformas y lo
      # reemplaza; dos a la vez se pisarían. Sin tag no se sube nada y van los tres juntos.
      max-parallel: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 3 }}
      matrix:
        include:
          - name: macOS universal (.dmg)
            os: macos-15
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: instalador-macos
          - name: Windows (MSI + NSIS)
            os: windows-latest
            args: ""
            rust_targets: ""
            artifact: instalador-windows
          - name: Linux (AppImage + deb + rpm)
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
            artifact: instalador-linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 (macOS)
        if: runner.os == 'macOS'
        # Igual que en ci.yml: `capture` compila un puente en Swift con APIs del SDK de macOS 26.
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::el runner no tiene Xcode 26"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - name: Dependencias de Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libpipewire-0.3-dev libclang-dev xvfb rpm

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Firma de macOS (Apple, certificado propio o ad-hoc)
        if: runner.os == 'macOS'
        shell: bash
        # Por orden de preferencia: Developer ID (y notarización) con los secrets APPLE_*; el
        # certificado propio con los MACOS_*, que mantiene la identidad entre versiones y con ella
        # el permiso de Grabación de pantalla; y si no hay nada, ad-hoc (`signingIdentity: "-"` en
        # tauri.conf.json) con un warning. Tauri se entera por las variables APPLE_*, y
        # APPLE_SIGNING_IDENTITY le gana a la del .json. Ver docs/release.md.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: tools/release/preparar-firma-macos.sh

      - name: Firma del updater (opcional)
        shell: bash
        # Con TAURI_SIGNING_PRIVATE_KEY se generan los paquetes del updater (.sig + latest.json).
        # Sin la clave el release sale igual, solo que sin actualizaciones automáticas.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::Sin TAURI_SIGNING_PRIVATE_KEY: se arman los instaladores sin actualizaciones automáticas, sin .sig ni latest.json (ver docs/release.md)."
            exit 0
          fi
          if grep -q "REEMPLAZAR_POR" app/src-tauri/tauri.conf.json; then
            echo "::error::Hay clave privada del updater pero falta la clave pública en plugins.updater.pubkey de tauri.conf.json."
            exit 1
          fi
          {
            echo "UPDATER_ARGS=--config app/src-tauri/tauri.updater.conf.json"
            echo "TAURI_SIGNING_PRIVATE_KEY<<__FIN_CLAVE__"
            echo "$TAURI_SIGNING_PRIVATE_KEY"
            echo "__FIN_CLAVE__"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Compilar y empaquetar
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}
          # Solo con tag: sube los instaladores al borrador de Release.
          releaseId: ${{ needs.borrador.outputs.id }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          # Con paquetes firmados, arma y sube el latest.json (cada job suma sus plataformas).
          includeUpdaterJson: true
          # `windows-x86_64` apunta al instalador por usuario, que no pide administrador.
          updaterJsonPreferNsis: true

      - name: Listar instaladores
        id: rutas
        shell: bash
        env:
          RUTAS_JSON: ${{ steps.tauri.outputs.artifactPaths }}
        # `artifactPaths` es un array JSON; upload-artifact quiere una ruta por línea.
        run: |
          {
            echo "lista<<__FIN_RUTAS__"
            echo "$RUTAS_JSON" | jq -r '.[]'
            echo "__FIN_RUTAS__"
          } >> "$GITHUB_OUTPUT"
          echo "$RUTAS_JSON" | jq -r '.[]'

      - name: Verificar la firma del bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          RUTAS_JSON: ${{ steps.tauri.outputs.artifactPaths }}
        # Revisa la .app suelta y la que viaja dentro del .dmg, que es la que instala la gente.
        # Con solo la firma del linker los recursos no quedan sellados. `/usr/bin/codesign` a
        # propósito: con el certificado propio hay un intermediario en el PATH.
        run: |
          set -euo pipefail
          suelta=$(jq -r '.[] | select(endswith(".app"))' <<<"$RUTAS_JSON")
          dmg=$(jq -r '.[] | select(endswith(".dmg"))' <<<"$RUTAS_JSON")
          # Un .dmg firmado con un certificado propio puede no abrirse (tauri#12288).
          if [ "$OPENLIGHT_FIRMA" != apple ] && /usr/bin/codesign --display "$dmg" 2>/dev/null; then
            echo "::error::$dmg salió firmado: sin Developer ID tiene que quedar sin firmar."
            exit 1
          fi
          montaje=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$montaje"
          trap 'hdiutil detach "$montaje" -quiet || true' EXIT
          for app in "$suelta" "$montaje/$(basename "$suelta")"; do
            echo "== $app"
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
            firma=$(/usr/bin/codesign --display --verbose=4 "$app" 2>&1)
            echo "$firma"
            if ! grep -q '^Sealed Resources version=' <<<"$firma"; then
              echo "::error::$app no tiene los recursos sellados."
              exit 1
            fi
            # Si el `-` de tauri.conf.json le ganara a la identidad de los secrets, se vería acá.
            if [ "$OPENLIGHT_FIRMA" != adhoc ] && grep -q '^Signature=adhoc$' <<<"$firma"; then
              echo "::error::hay identidad de firma configurada pero $app salió con firma ad-hoc."
              exit 1
            fi
            # El requisito designado es lo que macOS guarda con cada permiso: con una identidad
            # estable nombra al certificado; con el cdhash, cambia en cada build.
            requisito=$(/usr/bin/codesign --display --requirements - "$app" 2>/dev/null)
            echo "$requisito"
            if [ "$OPENLIGHT_FIRMA" != adhoc ] && grep -q 'cdhash' <<<"$requisito"; then
              echo "::error::el requisito de $app depende del cdhash: los permisos no sobrevivirían."
              exit 1
            fi
          done

      - name: Borrar el llavero temporal (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/openlight-firma.keychain-db" 2>/dev/null || true

      - name: Subir instaladores como artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.rutas.outputs.lista }}
          if-no-files-found: error

  # Antes de publicar se comprueba que en el latest.json no haya quedado ninguna plataforma
  # afuera. Si falta alguna, "Re-run all jobs" lo rehace sobre el mismo borrador.
  updater:
    name: Verificar latest.json
    needs: [borrador, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write # leer los archivos de un borrador lo exige
    steps:
      - name: Firmas de todas las plataformas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.borrador.outputs.id }}
          TAG: ${{ github.ref_name }}
          HAY_CLAVE: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAY_CLAVE" != "true" ]; then
            echo "::warning::Release sin actualizaciones automáticas: falta TAURI_SIGNING_PRIVATE_KEY (ver docs/release.md)."
            exit 0
          fi
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$asset" ]; then
            echo "::error::la Release no tiene latest.json."
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > latest.json
          jq '{version, platforms: (.platforms | map_values(.url))}' latest.json
          # `{os}-{arch}` es lo que pide cualquier instalación; las que terminan en el tipo de
          # paquete hacen que un .deb, .rpm o MSI se actualice con un paquete del mismo tipo.
          faltan=$(jq -r --arg ruta "/download/$TAG/" '
            . as $l
            | ["darwin-aarch64", "darwin-x86_64",
               "windows-x86_64", "windows-x86_64-nsis", "windows-x86_64-msi",
               "linux-x86_64", "linux-x86_64-appimage", "linux-x86_64-deb", "linux-x86_64-rpm"][]
            | select(
                (($l.platforms[.].signature // "") == "")
                or (($l.platforms[.].url // "") | contains($ruta) | not))
          ' latest.json)
          if [ -n "$faltan" ]; then
            echo "::error::latest.json sin firma o con URL equivocada para: $(echo $faltan)"
            exit 1
          fi
          if [ "v$(jq -r .version latest.json)" != "$TAG" ]; then
            echo "::error::latest.json anuncia otra versión que el tag $TAG."
            exit 1
          fi
          echo "latest.json completo para $TAG."
