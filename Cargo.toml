[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matiasm0rales/openlight"
authors = ["OpenLight contributors"]

[workspace.dependencies]
openlight-types = { path = "crates/openlight-types" }
async-trait = "0.1.92"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync"] }
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tauri = { version = "2.12.7", features = [] }
tauri-build = { version = "2.7.6", features = [] }
tauri-plugin-opener = "2.7.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true
