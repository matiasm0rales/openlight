[package]
name = "openlight"
description = "OpenLight: ambilight para focos Tuya / Smart Life"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "openlight"

[lib]
name = "openlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
openlight-types.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-updater = "2.14.1"
tauri-plugin-autostart = "2.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Estado de Grabación de pantalla (CGPreflight/CGRequestScreenCaptureAccess): API segura, sin `unsafe`.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow"] }

[lints.rust]
unsafe_code = "deny"
