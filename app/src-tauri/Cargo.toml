[package]
name = "openlight"
description = "OpenLight: ambilight para focos Tuya / Smart Life"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "openlight"

[lib]
name = "openlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
openlight-types.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-specta.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
# I1a: backend real (comandos IPC, estado y adaptadores)
openlight-core = { path = "../../crates/openlight-core" }
secrets = { path = "../../crates/secrets" }
capture = { path = "../../crates/capture" }
color-engine = { path = "../../crates/color-engine" }
tuya-cloud = { path = "../../crates/tuya-cloud" }
tuya-device = { path = "../../crates/tuya-device" }
tuya-discovery = { path = "../../crates/tuya-discovery" }
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
tracing = "0.1.44"
png = "0.18.1"
base64 = "0.22.1"
tauri-plugin-autostart = "2.7.0"
sys-locale = "0.3.2"
tauri-plugin-single-instance = "2.5.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2.5"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Grabación de pantalla (CGPreflight/CGRequestScreenCaptureAccess) y posición de cada monitor
# (CGDisplayBounds): API segura, sin `unsafe`.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow", "CGDirectDisplay"] }

[dev-dependencies]
tuya-sim = { path = "../../crates/tuya-sim" }
# Q4 (seguridad): la OpenAPI falsa y las formas en que podría aparecer un secreto
wiremock = "0.6.5"
# y el verificador de permisos de Tauri (runtime falso) con las capabilities reales
tauri = { workspace = true, features = ["test"] }
glob = "0.3.3"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt", "time", "macros", "sync", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Solo para `examples/banco.rs`: pedirle a WKWebView el PID de su proceso WebContent.
objc2 = "0.6.5"

[lints.rust]
unsafe_code = "deny"
