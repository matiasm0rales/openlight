[package]
name = "capture"
description = "Captura de pantalla multiplataforma: implementaciones de ScreenSource para macOS, Windows y Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
openlight-types.workspace = true
tokio.workspace = true

# Linux (E3): X11 con RandR + Render, Wayland con el portal ScreenCast + PipeWire.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["randr", "render", "dpms"] }
ashpd = { version = "0.14.3", default-features = false, features = ["tokio", "screencast"] }
tokio = { workspace = true, features = ["rt", "time", "macros"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
pipewire = { version = "0.10.1", optional = true }
tracing = "0.1.44"

[features]
default = ["pipewire"]
# Linux: cuadros de Wayland por PipeWire. Sin esta feature, Wayland responde `Unsupported`
# (sirve para compilar sin libpipewire, por ejemplo al chequear desde otra plataforma).
pipewire = ["dep:pipewire"]

[lints]
workspace = true
